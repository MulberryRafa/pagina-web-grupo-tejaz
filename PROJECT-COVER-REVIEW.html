<html lang="es">
<head>
<meta charset="utf-8">
<title>Revisión de portadas — Grupo Tejaz (herramienta local)</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --bg:#141414; --panel:#1c1c1c; --panel-2:#232323; --line:#333;
    --text:#eee; --muted:#9a9a9a; --accent:#e0a13d; --ok:#3d8b5f; --warn:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0 0 80px 0;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:#0f0f0f; border-bottom:1px solid var(--line);
    padding:18px 28px;
  }
  header h1{ margin:0 0 4px 0; font-size:20px; font-weight:600; }
  header p{ margin:0; color:var(--muted); font-size:13px; }
  header .badge{
    display:inline-block; background:var(--accent); color:#141414;
    font-weight:700; font-size:11px; padding:2px 8px; border-radius:4px;
    letter-spacing:.04em; margin-left:8px; vertical-align:middle;
  }
  .toc{
    max-width:1400px; margin:20px auto 0; padding:0 28px;
    display:flex; flex-wrap:wrap; gap:6px; font-size:12px;
  }
  .toc a{
    color:var(--muted); text-decoration:none; border:1px solid var(--line);
    padding:4px 8px; border-radius:4px; background:var(--panel);
  }
  .toc a.has-issue{ border-color:var(--warn); color:#e28b83; }
  .toc a:hover{ color:var(--text); border-color:var(--accent); }

  main{ max-width:1400px; margin:0 auto; padding:0 28px; }

  section.project{
    padding:36px 0; border-bottom:1px solid var(--line);
  }
  section.project:first-of-type{ padding-top:24px; }

  .project-head{
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    margin-bottom:4px;
  }
  .project-head h2{ margin:0; font-size:19px; font-weight:600; }
  .project-head .idx{ color:var(--muted); font-size:13px; }
  .source-folder{ color:var(--muted); font-size:12.5px; margin:0 0 16px 0; font-family:Consolas,monospace; }

  .cards{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:18px;
  }
  @media (min-width:900px){
    .cards{ grid-template-columns:repeat(3, 1fr); }
  }
  @media (max-width:899px) and (min-width:640px){
    .cards{ grid-template-columns:repeat(2, 1fr); }
  }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    overflow:hidden; display:flex; flex-direction:column;
  }
  .card.primary{
    border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 6px 20px rgba(224,161,61,.15);
  }
  .card-label{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 12px; font-size:11.5px; font-weight:700; letter-spacing:.06em;
    color:var(--muted); background:var(--panel-2); border-bottom:1px solid var(--line);
  }
  .card.primary .card-label{ color:#141414; background:var(--accent); }
  .card-label .tag-current{
    font-size:10px; font-weight:700; background:#141414; color:var(--accent);
    padding:2px 6px; border-radius:3px; letter-spacing:.04em;
  }
  .thumb-wrap{
    background:#000; display:flex; align-items:center; justify-content:center;
    min-height:260px; max-height:420px; overflow:hidden; cursor:zoom-in;
  }
  .thumb-wrap img{ width:100%; height:100%; object-fit:contain; display:block; max-height:420px; }
  .card-meta{ padding:10px 12px 14px; font-size:12.5px; color:var(--muted); line-height:1.6; }
  .card-meta .fname{ color:var(--text); font-family:Consolas,monospace; font-size:12px; word-break:break-all; display:block; margin-bottom:4px; }
  .card-meta .row{ display:flex; justify-content:space-between; gap:8px; }

  .no-alt{
    display:flex; align-items:center; justify-content:center; min-height:260px;
    color:var(--muted); font-size:13px; border:1px dashed var(--line); border-radius:8px;
    background:var(--panel);
  }

  .issue{
    margin-top:16px; padding:14px 16px; border:1px solid var(--warn);
    background:rgba(192,57,43,.1); border-radius:8px; font-size:13.5px;
  }
  .issue .flag{ color:#e28b83; font-weight:800; letter-spacing:.03em; margin-right:8px; }

  /* lightbox */
  #lightbox{
    position:fixed; inset:0; background:rgba(0,0,0,.92); display:none;
    align-items:center; justify-content:center; z-index:100; padding:40px; flex-direction:column;
  }
  #lightbox.open{ display:flex; }
  #lightbox img{ max-width:100%; max-height:82vh; object-fit:contain; }
  #lightbox .lb-caption{ color:#ccc; font-size:13px; margin-top:14px; font-family:Consolas,monospace; text-align:center; }
  #lightbox .lb-close{
    position:absolute; top:18px; right:26px; color:#fff; font-size:30px; cursor:pointer;
    line-height:1; user-select:none;
  }
  #lightbox .lb-close:hover{ color:var(--accent); }
</style>
</head>

function fmtBytes(b){
  if(!b) return "—";
  if(b < 1024*1024) return (b/1024).toFixed(0) + " KB";
  return (b/(1024*1024)).toFixed(2) + " MB";
}
function fmtRatio(w,h){
  if(!w || !h) return "—";
  const r = w/h;
  if(Math.abs(r-1) < 0.03) return "1:1 · cuadrada";
  if(r > 1) return r.toFixed(2) + ":1 · horizontal";
  return "1:" + (h/w).toFixed(2) + " · vertical";
}

function card(kind, label, cand, projId){
  if(!cand){
    return `<div class="no-alt">Sin ${label} disponible</div>`;
  }
  const src = `_review/project-covers/${projId}/${cand.copiedAs}`;
  const isPrimary = kind === "primary";
  return `
  <div class="card ${isPrimary ? 'primary' : ''}">
    <div class="card-label">
      <span>${label}</span>
      ${isPrimary ? '<span class="tag-current">SELECCIÓN ACTUAL</span>' : ''}
    </div>
    <div class="thumb-wrap" data-src="${src}" data-caption="${cand.originalName.replace(/"/g,'&quot;')} — ${cand.width}×${cand.height}">
      <img src="${src}" alt="${label} - ${projId}" loading="lazy">
    </div>
    <div class="card-meta">
      <span class="fname">${cand.originalName}</span>
      <div class="row"><span>Resolución</span><span>${cand.width}×${cand.height}px</span></div>
      <div class="row"><span>Proporción</span><span>${fmtRatio(cand.width, cand.height)}</span></div>
      <div class="row"><span>Tamaño</span><span>${fmtBytes(cand.sizeBytes)}</span></div>
    </div>
  </div>`;
}

const toc = document.getElementById('toc');
const main = document.getElementById('main');

DATA.forEach((p, i) => {
  const hasIssue = ISSUES.hasOwnProperty(p.id);

  const a = document.createElement('a');
  a.href = '#' + p.id;
  a.textContent = (i+1) + '. ' + p.name.trim();
  if(hasIssue) a.className = 'has-issue';
  toc.appendChild(a);

  const section = document.createElement('section');
  section.className = 'project';
  section.id = p.id;
  section.innerHTML = `
    <div class="project-head">
      <span class="idx">${String(i+1).padStart(2,'0')}</span>
      <h2>${p.name.trim()}</h2>
    </div>
    <p class="source-folder">Carpeta fuente: CASAS TEJAZ / ${p.sourceFolder}</p>
    <div class="cards">
      ${card('primary','PRIMARY', p.primary, p.id)}
      ${card('alt01','ALT 01', p.alt01, p.id)}
      ${card('alt02','ALT 02', p.alt02, p.id)}
    </div>
    ${hasIssue ? `<div class="issue"><span class="flag">⚠ COVER QUALITY ISSUE</span>${ISSUES[p.id]}</div>` : ''}
  `;
  main.appendChild(section);
});

// lightbox
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbCaption = document.getElementById('lbCaption');
document.addEventListener('click', (e) => {
  const wrap = e.target.closest('.thumb-wrap');
  if(wrap){
    lbImg.src = wrap.dataset.src;
    lbCaption.textContent = wrap.dataset.caption;
    lb.classList.add('open');
  }
});
document.getElementById('lbClose').addEventListener('click', () => lb.classList.remove('open'));
lb.addEventListener('click', (e) => { if(e.target === lb) lb.classList.remove('open'); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') lb.classList.remove('open'); });
</script>
